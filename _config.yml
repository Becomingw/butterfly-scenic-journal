title: 山间手记 · Scenic Journal
subtitle: 日子走过，文字留下。
description: 记录生活、兴趣与好奇心的山景博客。
author: Your Name
language: zh-CN
timezone: Asia/Shanghai
url: https://example.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true
theme: butterfly
post_asset_folder: false
default_layout: post
source_dir: source
public_dir: public
comments: false
filename_case: 0
date_format: YYYY-MM-DD
time_format: HH:mm:ss
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
  exclude_languages: []
  language_attr: false
  line_threshold: 0
prismjs:
  preprocess: false
skip_render:
  - admin/**
index_generator:
  per_page: 10
  order_by: -date
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
search:
  path: search.xml
  field: post
  content: true
  format: html
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false
  order_by: -date
sitemap:
  path: sitemap.xml
  tags: true
  categories: true
