name: Publish Scenic Journal
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: node:22.23.4@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
      volumes:
        - /srv/www/your-blog:/site
    steps:
      - name: Checkout exact Gitea commit
        env:
          CHECKOUT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          git init .
          git remote add origin "$CHECKOUT_URL"
          AUTH=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)
          git -c "http.extraHeader=AUTHORIZATION: basic $AUTH" fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
          unset AUTH CHECKOUT_TOKEN
      - name: Build and verify
        run: |
          set -eu
          npm ci --no-audit --no-fund
          PROJECTS_CACHE=/site/github-projects.json npm run refresh:projects
          npm run build
          npm run check
      - name: Publish static output
        run: |
          set -eu
          test -s public/index.html
          test -d /site
          find /site -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a public/. /site/
          test -s /site/index.html
